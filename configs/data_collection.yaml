# Data collection master configuration.
#
# All times are UTC. The collector is a single process with one asyncio event
# loop and one writer thread; each stream owns its own reconnecting socket or
# polling loop. See scripts/run_data_collector.py.

root: data/tape
flush_seconds: 60          # WAL fsync cadence
part_seconds: 300          # 5-minute WAL parts; bounds compaction memory at peak
health_seconds: 30
queue_max_rows: 500000     # writer queue bound; overflow spills to disk
compaction_workers: 2

streams:
  enabled: [clob, binance, deribit, kalshi, kalshi_books, news, polygon, whales, health, uma]

  clob:
    ws_url: wss://ws-subscriptions-clob.polymarket.com/ws/market
    rest_url: https://clob.polymarket.com
    shards: 8
    heartbeat_seconds: 10
    reconnect_max_seconds: 120
    shard_start_delay_seconds: 2.0
    universe_refresh_seconds: 21600   # 6h; reward-campaign walk ~5 s; Gamma crawl fallback ~20 min
    universe_max_pages: 10000         # safety cap; crawl until the Gamma cursor is exhausted
    universe_poll_seconds: 60         # incremental Gamma /markets poll between full walks
    universe_incremental: true        # new/closed poll; the hourly keyset walk reconciles
    cutoff_daily_reward: 15.0
    # "rolling" (default): re-cut the Gamma universe every hour and record the
    # membership in data/tape/universe/<stamp>.json. "locked": pin the set to
    # locked_manifest and only track markets present in it.
    universe_mode: rolling
    locked_manifest: data/tape/manifest_locked_1028.json
    manifest_path: data/tape/manifest_current.json
    # Crypto up/down sentinels: active BTC/ETH/SOL markets are subscribed even
    # below the reward cutoff so Gate 3 (spread) and lead-lag stay measurable.
    # They carry sentinel: true and are excluded from the reward pool total;
    # they are not allocator targets.
    sentinel_enabled: true
    sentinel_question_patterns: ["\\bbitcoin\\b", "\\bbtc\\b", "\\bethereum\\b", "\\beth\\b", "\\bsolana\\b", "\\bsol\\b"]
    sentinel_max_markets: 200
    # Reconnect safety: a `book` frame is the resync anchor. The raw tape keeps
    # every frame, so a gap is visible in the data rather than silently filled.
    resubscribe_initial_dump: true

  binance:
    ws_url: wss://stream.binance.com:9443/stream
    rest_url: https://api.binance.com
    symbols: [BTCUSDT, ETHUSDT, SOLUSDT, XRPUSDT, DOGEUSDT]
    depth_levels: 10
    depth_interval_ms: 1000
    funding_poll_seconds: 60
    oi_poll_seconds: 60

  deribit:
    rest_url: https://www.deribit.com/api/v2
    poll_seconds: 10
    indexes: [btc_usd, eth_usd]
    expiries: [7d, 14d, 30d]

  kalshi:
    # Public market-data endpoints work without an API key; the WebSocket
    # requires auth (HTTP 401), so this stream is REST polling only.
    rest_url: https://api.elections.kalshi.com/trade-api/v2
    poll_seconds: 2                  # mapped tickers only, 100 per request; 30/30 clean at 2 s
    trades_poll_seconds: 2           # 1 s is the measurable lead window; cursor catch-up keeps it contiguous
    trades_max_pages: 10             # page cap per cycle (10 x 1,000 prints)
    trades_scope: mapped             # write only tickers in the mapping
    batch_size: 100                  # Kalshi caps `tickers=` batches (~100 verified)
    heartbeat_seconds: 300           # full mapped snapshot every 5 min
    mapping_path: data/derived/kalshi_mapping_v2.parquet
    mapping_refresh_seconds: 900     # re-read after an hourly universe re-cut
    # Fallback only when the mapping is missing: page open markets that close
    # >14 d out (page order starts with thousands of MVE parlays).
    max_markets: 3000
    max_pages: 20
    min_close_days: 14
    discovery_seconds: 600
    status: open
    retry_total: 3
    backoff_base_seconds: 0.5
    max_backoff_seconds: 60
    timeout_seconds: 30

  kalshi_books:
    # Full bid ladders for the mapped tickers, one row per (ticker, snapshot).
    # `/markets/orderbooks` takes repeated `tickers=` params and caps a batch at
    # 100 tickers (101 -> 400, 200 -> 414). Measured p50 340 ms / 52 KB per
    # 100-ticker batch; 107 mapped tickers = 2 requests per poll.
    # REST-only by necessity: a production Kalshi key needs US KYC, so the
    # production WebSocket is out of scope and 2 s is the resolution floor.
    rest_url: https://api.elections.kalshi.com/trade-api/v2
    poll_seconds: 2
    batch_size: 100
    heartbeat_seconds: 60            # emit an unchanged book at least this often
    mapping_path: data/derived/kalshi_mapping_v2.parquet
    mapping_refresh_seconds: 900
    retry_total: 3
    backoff_base_seconds: 0.5
    max_backoff_seconds: 60
    timeout_seconds: 30

  news:
    rss_poll_seconds: 60
    rss_urls:
      - https://www.coindesk.com/arc/outboundfeeds/rss/
      - https://cointelegraph.com/rss
      - https://decrypt.co/feed
      - https://news.google.com/rss/search?q=polymarket&hl=en-US&gl=US&ceid=US:en
    gamma_comments_poll_seconds: 120
    gamma_comment_events: 50
    gamma_base_url: https://gamma-api.polymarket.com

  polygon:
    # Empty means: derive from polymarketbot.chain.rpc_url(), which rewrites the
    # configured Alchemy app key to polygon-mainnet. WSS is the primary path.
    rpc_url: ""
    ws_url: ""
    poll_seconds: 10
    log_block_span: 10            # Alchemy free tier eth_getLogs cap
    gas_poll_seconds: 10
    addresses:
      ctf: "0x4D97DCd97eC945f40cF65F87097ACe5EA0476045"
      uma_oo: "0xee3afe347d5c74317041e2618c49534daf887c24"
      uma_v1_adapter: "0xCB1822859cEF82Cd2Eb4E6276C7916e692995130"
      uma_adapter: "0x6A9D222616C90FcA5754cd1333cFD9b7fb6a4F74"

  whales:
    base_url: https://data-api.polymarket.com
    poll_seconds: 3600
    leaderboard_limit: 50
    activity_limit: 100

  uma:
    # UMA Optimistic Oracle V2 on Polygon plus Polymarket's resolution adapters
    # (v1 old, v2 current). Address provenance is in docs/data-collection.md;
    # the v2 adapter's optimisticOracle() call returns the OO address below.
    poll_seconds: 60
    log_block_span: 10             # Alchemy free tier eth_getLogs cap
    addresses:
      - "0xee3afe347d5c74317041e2618c49534daf887c24"
      - "0xCB1822859cEF82Cd2Eb4E6276C7916e692995130"
      - "0x6A9D222616C90FcA5754cd1333cFD9b7fb6a4F74"
    initial_lookback_blocks: 600   # cold start: ~20 min of ~2 s Polygon blocks
    max_windows_per_poll: 60       # 600 blocks/poll; deeper gaps close across polls
    window_pause_seconds: 0.15
    retry_total: 3
