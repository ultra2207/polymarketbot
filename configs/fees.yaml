# Fee schedule.
#
# Formula (docs.polymarket.com/trading/fees, verified 2026-11-01):
#
#     fee = C x rate x (p x (1 - p)) ^ exponent
#
# C = shares, p = price. Makers pay nothing. Fees round to 5 decimal places;
# anything smaller rounds to zero.
#
# IMPORTANT: the authoritative per-market source is Gamma's `feeSchedule`
# object (rate, exponent, takerOnly, rebateRate), alongside `feeType`
# (`sports_fees_v2` vs `sports_fees_v3`, `crypto_fees_v2`, ...). The era table
# below is a fallback for markets whose schedule has not been fetched.
#
# History, from docs.polymarket.com/changelog:
#   2026-01-05  taker fees enabled on 15-minute crypto markets, peak 1.56% at p=0.5
#   2026-02-12  5-minute crypto markets launched with the same curve
#   2026-02-18  sports fees on NCAAB and Serie A only (per-league, not modelled here)
#   2026-03-06  crypto fees extend to all crypto markets (new markets only)
#   2026-03-30  Fee Structure V2: per-category rates; geopolitics stays fee-free
#   2026-03-31  fees must be read from the market's `feeSchedule`
#   2026-04-28  V2 cutover: fees set at match time, `feeRateBps` removed from orders
#   2026-07-10  sports rate 0.03 -> 0.05; sports maker rebate 0.25 -> 0.15

formula:
  rounding_dp: 5
  min_fee: 0.00001
  maker_fee: 0.0

# Ordered; the last era whose `effective_from` is <= the trade time wins.
eras:
  - name: fee_free
    effective_from: 2020-01-01
    rates: {}          # every category 0.0
    rebates: {}

  - name: crypto_pilot
    effective_from: 2026-01-05
    note: >
      Crypto only, 15m then 5m markets. Gamma shows rate 0.25 with exponent 2
      for `crypto_fees` / `crypto_15_min`, which gives 0.25 * (p(1-p))^2, i.e.
      0.015625 per share at p=0.5 = the documented "peak 1.56%". The exponent is
      part of the schedule; rate alone is not enough to reproduce the curve.
    rates:
      crypto: 0.25
    exponents:
      crypto: 2.0
    rebates:
      crypto: 0.20

  - name: fee_structure_v2
    effective_from: 2026-03-30
    rates:
      crypto: 0.07
      sports: 0.03
      finance: 0.04
      politics: 0.04
      economics: 0.05
      culture: 0.05
      weather: 0.05
      tech: 0.04
      mentions: 0.04
      geopolitics: 0.0
      combos: 0.05
      other: 0.05
    rebates:
      crypto: 0.20
      sports: 0.25
      finance: 0.25
      politics: 0.25
      economics: 0.25
      culture: 0.25
      weather: 0.25
      tech: 0.25
      mentions: 0.25
      geopolitics: 0.0
      combos: 0.0
      other: 0.25

  - name: post_2026_07_10
    effective_from: 2026-07-10
    rates:
      crypto: 0.07
      sports: 0.05
      finance: 0.04
      politics: 0.04
      economics: 0.05
      culture: 0.05
      weather: 0.05
      tech: 0.04
      mentions: 0.04
      geopolitics: 0.0
      combos: 0.05
      other: 0.05
    rebates:
      crypto: 0.20
      sports: 0.15
      finance: 0.25
      politics: 0.25
      economics: 0.25
      culture: 0.25
      weather: 0.25
      tech: 0.25
      mentions: 0.25
      geopolitics: 0.0
      combos: 0.0
      other: 0.25

# Maps our coarse market category to a fee category.
category_map:
  sports: sports
  crypto: crypto
  finance: finance
  politics: politics
  economics: economics
  culture: culture
  weather: weather
  tech: tech
  geopolitics: geopolitics
  mentions: mentions
  health: other      # no health row in the fee table -> Other/General
  other: other

# Observed per-market schedules, keyed by Gamma `feeType`.
#
# Measured 2026-11-01 across 1,937,137 markets: these 16 types cover the entire
# scheduled universe, and each type has exactly one (rate, exponent, rebate)
# triple. The measurement script (`polymarketbot.tools.validate_fee_model`)
# has been retired; the measured table is the contract below.
#
# `rate` is the type's *current* value. Gamma reports only the present
# schedule, so a market created in 2025-06 carries today's rate — that is why
# this table is a contract for the era table, not a substitute for it. Point-in-
# time fees come from `eras`; this block is what `eras` must agree with at the
# end of history, and it is the only way to know a market is fee-free by design
# (`zero_fees`).
fee_types:
  zero_fees:                  {rate: 0.0,    exponent: 1.0, rebate: 0.0,   effective_from: 2025-09-17}
  crypto_15_min:              {rate: 0.25,   exponent: 2.0, rebate: 0.20,  effective_from: 2026-01-05}
  crypto_fees:                {rate: 0.25,   exponent: 2.0, rebate: 0.20,  effective_from: 2026-01-05}
  crypto_fees_v2:             {rate: 0.07,   exponent: 1.0, rebate: 0.20,  effective_from: 2026-01-05}
  sports_fees:                {rate: 0.0175, exponent: 1.0, rebate: 0.25,  effective_from: 2026-02-18}
  sports_fees_v2:             {rate: 0.03,   exponent: 1.0, rebate: 0.25,  effective_from: 2026-02-18}
  sports_fees_v3:             {rate: 0.05,   exponent: 1.0, rebate: 0.15,  effective_from: 2026-07-10}
  sports_fees_nfl_cfb_oct26:  {rate: 0.03,   exponent: 1.0, rebate: 0.15,  effective_from: 2026-08-21}
  weather_fees:               {rate: 0.05,   exponent: 1.0, rebate: 0.25,  effective_from: 2026-03-30}
  politics_fees:              {rate: 0.04,   exponent: 1.0, rebate: 0.25,  effective_from: 2026-03-30}
  culture_fees:               {rate: 0.05,   exponent: 1.0, rebate: 0.25,  effective_from: 2026-03-30}
  finance_prices_fees:        {rate: 0.04,   exponent: 1.0, rebate: 0.25,  effective_from: 2026-03-30}
  tech_fees:                  {rate: 0.04,   exponent: 1.0, rebate: 0.25,  effective_from: 2026-03-30}
  economics_fees:             {rate: 0.05,   exponent: 1.0, rebate: 0.25,  effective_from: 2026-03-30}
  mentions_fees:              {rate: 0.04,   exponent: 1.0, rebate: 0.25,  effective_from: 2026-03-30}
  general_fees:               {rate: 0.05,   exponent: 1.0, rebate: 0.25,  effective_from: 2026-03-30}

# ---------------------------------------------------------------------------
# Venue schedules. There are two live schedules and they are NOT the same:
#
#   global (clob.polymarket.com)  per-category feeRate, no volume tiers.
#                                 docs.polymarket.com/trading/fees, read 2026-11-10.
#   us     (polymarket.us)        one coefficient Theta per account tier, set daily
#                                 from trailing 30 *completed* ET days excluding
#                                 today. docs.polymarket.us/fees, read 2026-11-10.
#
# The bot trades the global CLOB, so `global` is the default and the `eras`
# table above is its history. The US ladder is data, not a constant, because a
# tier-1 account pays Theta 0.095 and a tier-4 account 0.0695 - a 36.7 % swing
# in fee on the same trade. Applying the global rate on a US venue would
# under-charge by that amount, so `fees.us_taker_coefficient` refuses to price
# a tier when the trailing volume is unknown rather than assuming one.
venues:
  global:
    formula: "C * rate * (p * (1 - p)) ^ exponent"
    rounding:
      dp: 5
      mode: half_up
    effective_from: 2026-07-10
    # Taker Rebate Program (live 2026-05-28, docs.polymarket.com/programs/
    # taker-rebates). A rebate reduces the *effective* taker cost, so leaving it
    # at zero overstates cost - the safe direction, but it must not be silent.
    #
    #   wV = trade_size_usd * (1 - entry_price) * category_weight * bonuses
    #
    # Tier is set by 30-day wV and updates daily at midnight UTC; rebates are
    # paid daily in pUSD with a $1 minimum. Tier 0 is 0 %, and 30-day wV below
    # $2,000 is tier 0 - the current state of this bot, which is why the model
    # books no rebate. `fees.taker_rebate_rate` refuses an unmeasured wV rather
    # than defaulting to the 0 % tier.
    taker_rebates:
      weighted_volume_weights:
        sports: 1.0
        politics: 1.3
        finance: 1.3
        mentions: 1.3
        tech: 1.3
        economics: 1.7
        culture: 1.7
        weather: 1.7
        other: 1.7
        crypto: 2.3
        geopolitics: 0.0
        combos: 1.7
      tiers:
        - {name: tier_0, min_30d_weighted_volume: 0.0, rebate: 0.00}
        - {name: bronze, min_30d_weighted_volume: 2000.0, rebate: 0.03}
        - {name: silver, min_30d_weighted_volume: 20000.0, rebate: 0.08}
        - {name: gold, min_30d_weighted_volume: 200000.0, rebate: 0.18}
        - {name: platinum, min_30d_weighted_volume: 1000000.0, rebate: 0.32}
        - {name: diamond, min_30d_weighted_volume: 4000000.0, rebate: 0.44}
        - {name: obsidian, min_30d_weighted_volume: 10000000.0, rebate: 0.50}
  us:
    formula: "theta * C * p * (1 - p)"
    effective_from: 2026-11-06T13:00:00-05:00
    rounding:
      dp: 2
      mode: half_even
    taker_tiers:
      # min trailing 30-day taker volume, in USD, to qualify for the tier.
      - {name: tier_1, min_30d_taker_volume_usd: 0.0, theta: 0.095}
      - {name: tier_2, min_30d_taker_volume_usd: 10000.0, theta: 0.085}
      - {name: tier_3, min_30d_taker_volume_usd: 50000.0, theta: 0.075}
      - {name: tier_4, min_30d_taker_volume_usd: 250000.0, theta: 0.0695}
    new_account_window:
      days_1_7_theta: 0.0695
      days_8_30_volume_acceleration: 30 / 7
    combo:
      # Fee = C * p * [theta * (1 - p) + fixed * (1 - p)^4]
      formula: "C * p * (theta * (1 - p) + fixed_power4 * (1 - p) ** 4)"
      fixed_power4_before: 0.085
      fixed_power4_after: 0.06
      change_effective_from: 2026-11-11T13:00:00-05:00
