# Sweep grid and evaluation splits.
#
# Nothing here is a "decision" yet — these are the axes the backtester must be
# able to vary. Early phases run the default cell only.

# Capital decision (2026-11-01): start small, start early. The bankroll caps how
# much of any capacity curve is usable, and it is deliberately the smallest
# viable number rather than the largest defensible one. At $250 against a p10
# ask depth of ~$1,500 an order is a fraction of one price level, so fills and
# exits are tractable without a heroic impact model.
capital:
  bankroll_usd: 2000
  max_order_usd: 250
  max_concurrent_positions: 8
  max_position_usd: 250
  # Hard stop, not a suggestion. Live code must read this, not a constant.
  daily_loss_limit_usd: 200

default_cell:
  notional_usd: 250
  # Exits are a decision, not a default: the harness reports every policy for
  # the same entry and the strategy layer chooses. See roadmap §4.1.
  exit_policy: compare_all
  queue: back

notional_usd: [50, 100, 250, 500, 1000, 2500, 5000]

horizons:
  - hold_to_resolution
  - plus_1d
  - plus_7d

# Every entry is evaluated under all of these on identical fills. None is a
# default: `hold_to_resolution` is the benchmark the others must beat.
exit_policies:
  - hold_to_resolution
  - taker_exit
  - limit_exit
  - stop
  - early_exit_on_signal

queue_fill_assumptions: [back, pro_rata, front]

# Windows are inclusive-start, exclusive-end (UTC).
splits:
  # 2023 is 0.1% of lifetime volume: a data artefact, not a period.
  model_dev:
    start: 2024-01-01
    end: 2026-03-31

  # Top-10 snapshot depth available (Dome / genesis-liquidity).
  fill_calibration:
    start: 2025-10-14
    end: 2026-03-31

  # The ONLY window where exit choice is observable rather than assumed:
  # book state must exist for the whole holding period, not just at entry.
  exit_policy_evaluation:
    start: 2026-04-13
    end: 2026-08-10

  # Full L2 depth available (PMXT v2).
  fill_validation:
    start: 2026-04-13
    end: 2026-05-31

  # Untouched until the go/no-go. Do not peek.
  forward_test:
    start: 2026-06-01
    end: 2026-08-10

  # Tape only, no depth: robustness, not a headline result.
  robustness:
    start: 2026-08-11
    end: 2026-10-04

data_windows:
  tape:
    start: 2022-11-21
    end: 2026-10-04
  dome_depth:
    start: 2025-10-14
    end: 2026-03-31
  pmxt_v2_depth:
    start: 2026-04-13T19
    end: 2026-08-10T23
  # PMXT v1 is quarantined: ~50% market coverage gaps.
  pmxt_v1_quarantined:
    start: 2026-02-23
    end: 2026-04-16

# Protocol cutover. V2 is 41% of all fills, so this cannot be a footnote.
protocol:
  v1:
    ctf_exchange: "0x4bfb41d5b3570defd03c39a9a4d8de6bd8b8982e"
    neg_risk_exchange: "0xc5d563a36ae78145c45a50134d48a1215220f80a"
    collateral: "0x2791bca1f2de4661ed88a30c99a7a9449aa84174"
    collateral_symbol: USDC
  v2:
    ctf_exchange: "0xe111180000d2663c0091e4f400237545b87b996b"
    neg_risk_exchange: "0xe2222d279d744050d28e00520010520000310f59"
    collateral: pUSD
    activation: 2026-04-28

# Universe rules. Documented here so Phase 2 has exactly one definition.
universe:
  exclude_zero_volume: true
  min_lifetime_seconds: 3600
  # Void resolution: pay out at the on-chain payout (0.5 per share for a
  # standard void), never as a win or a loss.
  void_settlement: payout
  min_volume_usd: 0
