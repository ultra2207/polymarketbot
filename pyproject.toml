[project]
name = "polymarketbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ultra2207", email = "119686777+ultra2207@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "duckdb>=2.0.0",
    "loguru>=0.7.3",
    "pycryptodome>=4.2.0",
    "pytz>=2026.6",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "tqdm>=4.70.1",
]

[project.scripts]
polymarketbot = "polymarketbot:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
